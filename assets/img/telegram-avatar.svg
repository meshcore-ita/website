<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MeshCore ITA">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#101a13"/>
      <stop offset="70%" stop-color="#050706"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="210" fill="url(#halo)"/>

  <!-- mesh links -->
  <g fill="none" stroke="#e6e6e6" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round">
    <line x1="256" y1="128" x2="148" y2="320"/>
    <line x1="256" y1="128" x2="364" y2="320"/>
    <line x1="148" y1="320" x2="364" y2="320"/>
    <line x1="256" y1="128" x2="256" y2="236"/>
    <line x1="148" y1="320" x2="256" y2="236"/>
    <line x1="364" y1="320" x2="256" y2="236"/>
  </g>

  <!-- nodes -->
  <circle cx="256" cy="128" r="30" fill="#22c55e"/>
  <circle cx="148" cy="320" r="30" fill="#22c55e"/>
  <circle cx="364" cy="320" r="30" fill="#e11d48"/>
  <circle cx="256" cy="236" r="34" fill="#f5f5f5"/>

  <text x="256" y="437" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="66" font-weight="700" letter-spacing="6" fill="#fafafa">ITA</text>
</svg>
